name: Update Giveaway & Bundle Feed

on:
  schedule:
    # Runs every Thursday at 16:30 UTC (shortly after Epic Games Store weekly rotation) and Monday at 18:00 UTC
    - cron: '30 16 * * 4'
    - cron: '0 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Epic, Prime, Steam, GOG & Humble giveaways
        run: node scripts/update-feed.mjs

      - name: Commit and push updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed/history.json
          git diff --staged --quiet || git commit -m "chore(feed): auto-update giveaway & bundle dataset"
          git push

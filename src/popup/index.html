<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wait2Play</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" class="brand-icon" />
        <div class="brand-title">Wait2Play</div>
      </div>
      <button id="open-options" class="icon-btn" title="Libraries, Steam Backlog &amp; Settings">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5">
          <polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75" />
          <circle cx="8" cy="8" r="2.3" />
        </svg>
        <span>Settings</span>
      </button>
    </header>

    <section id="steam-onboard-root" class="steam-onboard-root" hidden></section>

    <section class="search-bar">
      <form id="search-form" autocomplete="off">
        <input
          id="search-input"
          type="search"
          placeholder="Search any game (e.g. Hades, Control, Civilization VI)…"
        />
        <button type="submit">Search</button>
      </form>
      <ul id="search-results" class="search-results" hidden></ul>
    </section>

    <main id="verdict-root" class="verdict-root"></main>

    <section id="seasonal-root" class="seasonal-root"></section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
